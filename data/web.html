<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3a0ca3;
      --background-color: #f8f9fa;
      --card-background: #ffffff;
      --text-color: #212529;
      --text-secondary: #6c757d;
      --success-color: #2ecc71;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body { 
      font-family: 'Poppins', Arial, sans-serif; 
      text-align: center; 
      background-color: var(--background-color);
      color: var(--text-color);
      padding: 40px 20px;
      background-image: radial-gradient(#4361ee 0.5px, transparent 0.5px), radial-gradient(#4361ee 0.5px, var(--background-color) 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      background-attachment: fixed;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 60px;
      color: var(--secondary-color);
      font-weight: 700;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
      margin-bottom: 50px;
      position: relative;
      display: inline-block;
    }
    
    h1:after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 5px;
      background-color: var(--primary-color);
      border-radius: 2px;
    }
    
    .data-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      margin-bottom: 50px;
    }
    
    .data-item {
      padding: 35px;
      background: var(--card-background);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      width: 320px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .data-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
    }
    
    .data-item h2 {
      font-size: 22px;
      margin-bottom: 20px;
      color: var(--text-secondary);
      font-weight: 600;
    }
    
    .data-item p {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--primary-color);
    }
    
    .data-bar {
      width: 100%;
      height: 20px;
      background-color: #f0f0f0;
      border-radius: 10px;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }
    
    .data-level {
      height: 100%;
      width: 0%;
      background-color: var(--primary-color);
      border-radius: 10px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    .button-container {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 25px;
    }
    
    .button {
      padding: 16px 36px; 
      cursor: pointer; 
      font-size: 18px;
      font-weight: 600; 
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 8px rgba(67, 97, 238, 0.3);
    }
    
    .button:hover {
      background-color: var(--secondary-color);
      transform: translateY(-2px);
      box-shadow: 0 8px 12px rgba(67, 97, 238, 0.4);
    }
    
    .button:active {
      transform: translateY(1px);
    }
    
    .loading {
      font-size: 20px;
      color: var(--text-secondary);
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    
    @media (max-width: 768px) {
      .data-container {
        flex-direction: column;
        align-items: center;
      }
      
      .data-item {
        width: 90%;
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ESP32 Smart Monitoring</h1>
    <div class="data-container"> 
      
      <div class="data-item">
        <h2>Temperature</h2>
        <p id="temperature" class="loading">Loading...</p>
        <div class="data-bar">
          <div id="temperature-bar" class="data-level"></div>
        </div>
      </div>

      <div class="data-item">
        <h2>Humidity</h2>
        <p id="humidity" class="loading">Loading...</p>
        <div class="data-bar">
          <div id="humidity-bar" class="data-level"></div>
        </div>
      </div>

      <div class="data-item">
        <h2>Light Intensity</h2>
        <p id="light" class="loading">Loading...</p>
        <div class="data-bar">
          <div id="light-bar" class="data-level"></div>
        </div>
      </div>

      <div class="data-item">
        <h2>Soil Moisture</h2>
        <p id="soilmoisture" class="loading">Loading...</p>
        <div class="data-bar">
          <div id="soilmoisturebar" class="data-level"></div>
        </div>
      </div>
    </div>

    <div class="button-container">
      <button class="button" onclick="toggleLED('on')">Turn LED On</button>
      <button class="button" onclick="toggleLED('off')">Turn LED Off</button>
    </div>
  </div>

  <script>
    setInterval(() => {
      fetch('/temperature')
        .then(response => response.text())
        .then(data => {
          document.getElementById('temperature').innerText = `${data} °C`;
          updateBar('temperature-bar', data, 0, 50);
        });

      fetch('/humidity')
        .then(response => response.text())
        .then(data => {
          document.getElementById('humidity').innerText = `${data} %`;
          updateBar('humidity-bar', data, 0, 100);
        });

      fetch('/soilmoisture')
        .then(response => response.text())
        .then(data => {
          document.getElementById('soilmoisture').innerText = `${data} g/m³`;
          updateBar('soilmoisturebar', data, 0, 5000);
        });

      fetch('/light')
        .then(response => response.text())
        .then(data => {
          document.getElementById('light').innerText = `${data} lux`;
          updateBar('light-bar', data, 0, 5000);
        });
    }, 500);

    function updateBar(barId, value, min, max) {
      const clampedValue = Math.max(min, Math.min(max, value));
      const percentage = ((clampedValue - min) / (max - min)) * 100;
      const barElement = document.getElementById(barId);
      barElement.style.width = percentage + '%';
      if (barId === 'temperature-bar') {
        if (value < 27) barElement.style.backgroundColor = '#3498db';
        else if (value >= 27 && value <= 28) barElement.style.backgroundColor = '#2ecc71';
        else barElement.style.backgroundColor = '#e74c3c';
      }
    }

    function toggleLED(state) {
      fetch(`/led/${state}`)
        .then(response => response.text())
        .then(data => alert(data));
    }
  </script>
</body>
</html>
